<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Ghost Ships</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Ghost-ship theme: night-sea masthead, every stage has its own colour, wide layout. Light page only. */
:root{
  --bg:#E9F0F5; --card:#FFFFFF; --ink:#0E1B2B; --ink2:#42536A; --line:#CFDCE6; --soft:#F5F9FC;
  --night:#09131F; --night2:#12314B; --ghost:#F2F8FB; --glow:#8FE3E8; --lantern:#FFC857;
  --ok:#D8F3E5; --okline:#138A57; --bad:#FFE1D8; --badline:#BE3A19;
  --serif:Georgia,"Times New Roman",serif; --sans:Arial,Helvetica,sans-serif;
  --a:#1B3A5C; --a2:#E0E8F1; --a3:#10263F; --on:#fff;
  color-scheme:light;
}
[data-hue=navy]{--a:#1B3A5C;--a2:#E0E8F1;--a3:#10263F;--on:#fff}
[data-hue=teal]{--a:#0E8C8F;--a2:#D9F2F2;--a3:#065B5D;--on:#fff}
[data-hue=violet]{--a:#6B46D6;--a2:#ECE6FB;--a3:#432796;--on:#fff}
[data-hue=blue]{--a:#2563D8;--a2:#E1EBFC;--a3:#173F94;--on:#fff}
[data-hue=cyan]{--a:#0A86B8;--a2:#D9F0F8;--a3:#065070;--on:#fff}
[data-hue=coral]{--a:#E2502B;--a2:#FDE5DC;--a3:#8C2A10;--on:#fff}
[data-hue=rose]{--a:#C93A78;--a2:#FBE1EC;--a3:#7E1F4A;--on:#fff}
[data-hue=amber]{--a:#F0A81A;--a2:#FEF0CC;--a3:#6E4600;--on:#15110A}
[data-hue=indigo]{--a:#4A55C9;--a2:#E4E6FA;--a3:#2A3380;--on:#fff}
[data-hue=mint]{--a:#16936B;--a2:#D8F2E8;--a3:#0A5840;--on:#fff}
[data-hue=orange]{--a:#F27A14;--a2:#FFE8D3;--a3:#873C00;--on:#15110A}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--night);z-index:30}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(clamp(14px,3vw,32px),env(safe-area-inset-left,0px));padding-right:max(clamp(14px,3vw,32px),env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--serif);text-wrap:balance;line-height:1.2;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* masthead */
.mast{position:relative;overflow:hidden;color:var(--ghost);background:
  radial-gradient(900px 260px at 78% 110%,rgba(143,227,232,.28),transparent 70%),
  radial-gradient(600px 200px at 10% 120%,rgba(255,200,87,.12),transparent 70%),
  linear-gradient(135deg,var(--night) 0%,var(--night2) 100%)}
.mast .wrap{position:relative;display:flex;align-items:center;justify-content:space-between;gap:20px;padding-block:28px 26px}
.mast .txt{min-width:0}
.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--lantern);margin:0 0 8px;font-weight:700}
.mast h1{font-size:clamp(34px,7vw,58px);font-weight:700;color:var(--ghost);text-shadow:0 0 28px rgba(143,227,232,.45)}
.mast .sub{margin:10px 0 0;max-width:52ch;color:#C9DCE8;font-size:16px}
.mast .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.mast .chips span{font-size:13px;font-weight:700;padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#E5F1F7}
.mast svg{flex:0 0 auto;width:min(340px,38vw);height:auto;opacity:.95}
@media (max-width:640px){.mast svg{display:none}}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(233,240,245,.97);border-bottom:1px solid var(--line);box-shadow:0 4px 14px rgba(9,19,31,.06)}
.tabs .wrap{display:flex;gap:7px;overflow-x:auto;padding-block:9px;scrollbar-width:thin}
@media (min-width:1000px){.tabs .wrap{flex-wrap:wrap;overflow:visible}}
.chip{flex:0 0 auto;min-height:40px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px 5px 10px;cursor:pointer;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.chip b{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:11px;background:var(--a);color:var(--on);font-size:12px;font-variant-numeric:tabular-nums;padding:0 5px}
.chip:not(:has(b))::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--a)}
.chip:hover{border-color:var(--a)}
.chip[aria-current=true]{background:var(--a);color:var(--on);border-color:var(--a);font-weight:700}
.chip[aria-current=true] b{background:#fff;color:var(--a3)}
.chip[aria-current=true]:not(:has(b))::before{background:#fff}

main{padding-block:24px 70px}
.stagewrap{--hl:var(--a2)}
.stagehead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-bottom:18px;padding-bottom:12px;border-bottom:4px solid var(--a)}
.stagehead h2{font-size:clamp(26px,4.6vw,38px);color:var(--a3)}
.mins{font-size:13px;background:var(--a);color:var(--on);padding:3px 12px;border-radius:999px;font-weight:700}
.prose p{margin:0 0 12px;max-width:80ch}
.lede{font-family:var(--serif);font-size:20px;line-height:1.5;color:var(--ink);max-width:80ch;margin:0}
.stack>*+*{margin-top:20px}

/* cards */
.box,.ex,.qs,.flipbox,.audiobox,details{background:var(--card);border:1.5px solid var(--line);border-top:5px solid var(--a);border-radius:14px;box-shadow:0 8px 22px rgba(9,19,31,.06)}
.box{padding:18px}
.note{background:var(--card);border:1.5px solid var(--line);border-left:7px solid var(--a);border-radius:12px;padding:16px 20px;box-shadow:0 6px 18px rgba(9,19,31,.05)}
.note h3{font-size:19px;margin-bottom:8px;color:var(--a3)}
.note h4{font-size:15px;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.08em;color:var(--a3)}
.note p,.note ul{margin:0 0 8px;max-width:90ch}
.note ul{padding-left:20px}
.note li{margin-bottom:6px}
.note b,.prose b,.lede b,.instr b,.qs li b,.read-note b{background:var(--a2);color:var(--a3);padding:1px 6px;border-radius:5px;font-weight:700}
.eg{font-style:italic;color:var(--ink2);display:inline-block;border-left:3px solid var(--a);padding-left:8px;margin-top:2px}
.ex-tag{display:inline-block;font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--on);background:var(--a);padding:2px 10px;border-radius:999px}

/* photos */
.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
figure.photo{margin:0;background:var(--card);border:1.5px solid var(--line);border-radius:14px;overflow:hidden;min-width:0;box-shadow:0 8px 22px rgba(9,19,31,.08)}
figure.photo img{display:block;width:100%;height:auto;max-height:440px;object-fit:cover}
figure.photo figcaption{font-size:14px;color:var(--ink2);padding:10px 14px;border-top:4px solid var(--a)}
.slot{display:flex;align-items:center;justify-content:center;text-align:center;min-height:170px;padding:16px;background:repeating-linear-gradient(135deg,var(--a2) 0 12px,#F4F8FB 12px 24px);color:var(--ink2);font-family:var(--serif);font-style:italic}
.slot label{display:inline-block;margin-top:8px;font-family:var(--sans);font-style:normal;font-size:13px;background:var(--a);color:var(--on);padding:6px 12px;border-radius:8px;cursor:pointer}

/* reading: text on the left, word help on the right */
.readwrap{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:20px;align-items:start}
@media (max-width:980px){.readwrap{grid-template-columns:1fr}}
.read{background:#FFFDF6;border:1.5px solid #E5DCC2;border-left:8px solid var(--a);border-radius:6px 14px 14px 6px;padding:22px 26px 10px;box-shadow:0 8px 22px rgba(9,19,31,.07)}
.read h3{font-size:28px;margin-bottom:2px;color:var(--a3)}
.read .sub{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:var(--a);margin:0 0 14px;font-weight:700}
.read p{font-family:var(--serif);font-size:18.5px;line-height:1.75;margin:0 0 16px}
.read p i{font-style:italic;color:var(--a3)}
.read b{font-weight:700;background:linear-gradient(transparent 55%,var(--lantern) 55%);padding:0 2px}
.read .np{position:relative;padding-left:46px}
.pn{position:absolute;left:0;top:3px;width:30px;height:30px;border-radius:50%;background:var(--a);color:var(--on);font-family:var(--sans);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center}
.gloss{background:var(--a2);border:1.5px solid var(--line);border-top:5px solid var(--a);border-radius:14px;padding:14px 16px;position:sticky;top:78px}
@media (max-width:980px){.gloss{position:static}}
.gloss h4{font-size:15px;text-transform:uppercase;letter-spacing:.1em;color:var(--a3);margin-bottom:8px}
.gloss div{padding:7px 0;border-top:1px dashed rgba(14,27,43,.2);font-size:14.5px;line-height:1.4}
.gloss div:first-of-type{border-top:0}
.gloss strong{display:block;font-family:var(--serif);font-size:16px;color:var(--a3)}
.gloss span{color:var(--ink)}

/* discussion */
.qs{padding:18px 20px}
.qs h3{font-size:20px;margin-bottom:10px;color:var(--a3)}
.qs ol{margin:0;padding-left:0;list-style:none;counter-reset:q;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.qs li{counter-increment:q;padding:10px 12px 10px 48px;position:relative;background:var(--soft);border-radius:10px}
.qs li::before{content:counter(q);position:absolute;left:10px;top:9px;width:28px;height:28px;border-radius:50%;background:var(--a);color:var(--on);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}

/* flip cards */
.flipbox{padding:18px 20px}
.flipbox>h3{font-size:21px;color:var(--a3)}
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:6px}
.flip{--k:#2563D8;--ks:#E1EBFC;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:7px;min-height:150px;padding:14px 16px;border-radius:14px;border:2.5px solid var(--k);background:#fff;cursor:pointer;text-align:left;box-shadow:0 5px 14px rgba(9,19,31,.08)}
.flip:hover{transform:translateY(-2px)}
.flip[aria-pressed=true]{background:var(--ks)}
.flip .fk{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;background:var(--k);color:#fff;padding:2px 9px;border-radius:999px}
.flip .fw{font-family:var(--serif);font-size:25px;font-weight:700;color:var(--k);line-height:1.15}
.flip .fh{font-size:12.5px;color:var(--ink2)}
.flip .fd{font-size:15.5px;font-weight:700;color:var(--ink);line-height:1.35}
.flip .fe{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink2);line-height:1.4}
.flip.verb{--k:#6B46D6;--ks:#ECE6FB}
.flip.noun{--k:#2563D8;--ks:#E1EBFC}
.flip.adjective{--k:#16936B;--ks:#D8F2E8}
.flip.phrase{--k:#C77A00;--ks:#FEF0CC}
.flip.collocation{--k:#E2502B;--ks:#FDE5DC}
.flip.phrasal-verb{--k:#0E8C8F;--ks:#D9F2F2}
.flip.word{--k:#4A55C9;--ks:#E4E6FA}

/* exercises */
.ex{padding:18px 20px}
.ex>h3{font-size:22px;margin:6px 0 4px;color:var(--a3)}
.instr{margin:4px 0 14px;color:var(--ink2);max-width:90ch}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;padding:10px 12px;background:var(--a2);border-radius:12px}
.bank span{background:#fff;border:2px solid var(--a);color:var(--a3);border-radius:8px;padding:3px 11px;font-size:15px;font-weight:700}
.exbody{display:grid;gap:12px 18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr))}
.exbody>.bank,.exbody>.defs,.exbody>.note{grid-column:1/-1}
.item{background:var(--soft);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.q{margin:0 0 8px}
.n{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--a);color:var(--on);font-size:13px;font-weight:700;margin-right:8px;padding:0 7px;font-variant-numeric:tabular-nums}
.opts{display:grid;gap:8px}
.opts.row{grid-template-columns:repeat(3,1fr)}
@media (max-width:560px){.opts.row .l{display:none}.opts.row .opt{justify-content:center;padding:8px 4px}}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;min-height:44px;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
.opt .l{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--a2);color:var(--a3);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.opt:hover:not([disabled]){border-color:var(--a);background:var(--a2)}
.opt.ok{background:var(--ok);border-color:var(--okline)}
.opt.bad{background:var(--bad);border-color:var(--badline)}
.opt[disabled]{cursor:default;color:var(--ink)}
.fb{margin-top:8px;padding:8px 12px;border-radius:8px;font-size:15px}
.fb.ok{background:var(--ok)}
.fb.bad{background:var(--bad)}
.fb b{font-weight:700}
.in{border:2px solid var(--ink2);border-radius:8px;padding:4px 8px;min-height:36px;background:#fff;max-width:100%}
.in:focus{border-color:var(--a)}
.in.ok{background:var(--ok);border-color:var(--okline)}
.in.bad{background:var(--bad);border-color:var(--badline)}
select.in{padding-right:4px}
.lab{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--a3);margin-left:4px}
.gn{font-size:12px;font-weight:700;color:var(--a);margin:0 3px 0 2px}
.cloze{font-family:var(--serif);font-size:18px;line-height:2.4;background:var(--soft);border:1.5px solid var(--line);border-radius:12px;padding:14px 18px}
.cloze p{margin:0 0 10px}
.exbody.k-cloze{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}
.exbody.k-cloze:has(.expl:empty){grid-template-columns:1fr}
.expl:empty{display:none}
@media (max-width:900px){.exbody.k-cloze{grid-template-columns:1fr}}
.kw{display:inline-block;background:var(--lantern);color:var(--ink);font-weight:700;letter-spacing:.08em;padding:2px 10px;border-radius:6px;font-size:14px}
.kwline{line-height:2.2;margin:6px 0}
.kwline .in{width:min(100%,360px)}
.defs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px;margin-bottom:6px;font-size:15px}
.defs div{background:var(--a2);border-radius:10px;padding:8px 12px;min-width:0;border-left:5px solid var(--a)}
.defs b{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--a);color:var(--on);margin-right:8px;font-size:13px}
.matchrow{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--soft);border:1.5px solid var(--line);border-radius:12px}
.matchrow .w{flex:1 1 130px;font-weight:700;font-size:17px;font-family:var(--serif)}
.matchrow select{flex:0 0 auto;font-weight:700;min-width:64px}
.matchrow .mk{font-size:14px;font-weight:700;min-width:90px}
.expl{margin-top:0;display:grid;gap:6px}
.expl div{font-size:15px;padding:7px 11px;border-radius:8px}
.expl .ok{background:var(--ok)}
.expl .bad{background:var(--bad)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px;padding-top:14px;border-top:2px dashed var(--line)}
.btn{min-height:44px;border-radius:10px;padding:8px 18px;font-weight:700;cursor:pointer;border:2px solid transparent}
.btn.primary{background:var(--a);color:var(--on)}
.btn.gold{background:var(--lantern);color:var(--ink)}
.btn.ghost{background:var(--card);border-color:var(--ink2)}
.btn.next{background:var(--night);color:var(--ghost)}
.btn:hover{filter:brightness(.94)}
.score{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;color:var(--a3)}
.sm{min-height:36px;padding:4px 14px;font-size:14px;margin-top:2px}

/* details, audio */
details>summary{cursor:pointer;padding:14px 18px;font-weight:700;min-height:44px;color:var(--a3)}
details>div{padding:0 18px 16px}
details .tx p{margin:0 0 10px;max-width:90ch}
audio{width:100%}
.audiobox{padding:16px 20px}
.audiobox h3{font-size:19px;margin-bottom:10px;color:var(--a3)}

/* theories */
.cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr))}
.case{--c:#E2502B;--cs:#FDE5DC;background:var(--card);border:1.5px solid var(--line);border-top:6px solid var(--c);border-radius:14px;padding:16px 18px;min-width:0;box-shadow:0 8px 22px rgba(9,19,31,.07)}
.case:nth-child(7n+1){--c:#E2502B;--cs:#FDE5DC}
.case:nth-child(7n+2){--c:#2563D8;--cs:#E1EBFC}
.case:nth-child(7n+3){--c:#C77A00;--cs:#FEF0CC}
.case:nth-child(7n+4){--c:#C93A78;--cs:#FBE1EC}
.case:nth-child(7n+5){--c:#16936B;--cs:#D8F2E8}
.case:nth-child(7n+6){--c:#6B46D6;--cs:#ECE6FB}
.case:nth-child(7n+7){--c:#0A86B8;--cs:#D9F0F8}
.case header{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:8px}
.case h3{font-size:22px;color:var(--c)}
.tag{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;background:var(--c);color:#fff;padding:2px 9px;border-radius:999px}
.tag.fic{background:var(--ink)}
.case .nar{font-family:var(--serif);font-style:italic;font-size:17px;line-height:1.65;margin:0 0 12px;background:var(--cs);padding:10px 12px;border-radius:10px}
.case .evi{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:14.5px}
@media (max-width:560px){.case .evi{grid-template-columns:1fr}}
.case .evi div{background:var(--ok);border-radius:8px;padding:8px 10px}
.case .evi .ag{background:var(--bad)}
.case .evi b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--okline)}
.case .evi .ag b{color:var(--badline)}
.rate{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px;font-size:14px}
.rate button{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink2);background:var(--card);font-weight:700;cursor:pointer}
.rate button[aria-pressed=true]{background:var(--c);color:#fff;border-color:var(--c)}
.topline{margin-top:12px;font-weight:700}

/* rule box: certainty scale */
.rule .scale{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));margin:6px 0 4px}
.rule .s{border-radius:14px;padding:12px 14px;border:2.5px solid}
.rule .s-yes{background:#D8F3E5;border-color:#138A57}
.rule .s-maybe{background:#FEF0CC;border-color:#E39A00}
.rule .s-no{background:#FDE5DC;border-color:#E2502B}
.rule .m{font-family:var(--serif);font-weight:700;font-size:21px;margin-bottom:4px}
.rule .d{font-size:15px;margin-bottom:8px}
.rule .x{background:#fff;border-radius:8px;padding:7px 10px;font-style:italic;font-size:15px}
.rule .s b{background:rgba(255,255,255,.7);color:var(--ink)}

/* tense table */
.tw{overflow-x:auto;background:var(--card);border:1.5px solid var(--line);border-top:5px solid var(--a);border-radius:14px;box-shadow:0 8px 22px rgba(9,19,31,.06)}
table.tt{border-collapse:collapse;width:100%;min-width:560px;font-size:15px}
table.tt th,table.tt td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}
table.tt th{background:var(--a);color:var(--on)}
table.tt td:first-child{font-weight:700;background:var(--a2);color:var(--a3);white-space:nowrap}
table.tt tr:nth-child(even) td:not(:first-child){background:var(--soft)}

/* writing */
.field{display:grid;gap:4px;margin-bottom:12px}
.field label,.lbl{font-weight:700;font-size:14px;color:var(--a3)}

<div class="mast"><div class="wrap"><div class="txt"><p class="eyebrow">Target English</p><h1>Ghost Ships</h1><p class="sub">The Mary Celeste, the Baychimo and the Joyita: three real ships, no crew and no explanation.</p><div class="chips"><span>B2 / FCE</span><span>90 minutes</span><span>British English</span></div></div><svg viewBox="0 0 340 190" role="img" aria-label="A pale ghost ship sailing under the moon" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="mg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFF6D6" stop-opacity=".95"/><stop offset="1" stop-color="#FFF6D6" stop-opacity="0"/></radialGradient><linearGradient id="sl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2F8FB" stop-opacity=".95"/><stop offset="1" stop-color="#9FD9E0" stop-opacity=".55"/></linearGradient></defs><circle cx="262" cy="52" r="58" fill="url(#mg)"/><circle cx="262" cy="52" r="24" fill="#FFF3C4"/><g opacity=".9"><path d="M168 22 V138" stroke="#CFE6EE" stroke-width="3"/><path d="M118 40 V138" stroke="#CFE6EE" stroke-width="3"/><path d="M122 46 L162 52 L158 110 L122 120 Z" fill="url(#sl)"/><path d="M174 28 L222 40 L218 112 L174 118 Z" fill="url(#sl)"/><path d="M174 118 L222 112 L226 100" fill="none" stroke="#F2F8FB" stroke-dasharray="4 4" opacity=".7"/><path d="M72 138 H252 L232 166 H96 Z" fill="#0A1F33" stroke="#8FE3E8" stroke-width="2"/><path d="M96 150 H232" stroke="#8FE3E8" stroke-width="1.5" opacity=".6"/></g><path d="M0 172 Q28 164 56 172 T112 172 T168 172 T224 172 T280 172 T340 172 V190 H0 Z" fill="#12314B" opacity=".9"/><path d="M0 182 Q34 175 68 182 T136 182 T204 182 T272 182 T340 182 V190 H0 Z" fill="#8FE3E8" opacity=".25"/></svg></div></div>
<nav class="tabs" aria-label="Lesson stages"><div class="wrap" id="tabs"></div></nav>
<main><div class="wrap" id="stage"></div></main>
<script>
var LESSON = {
  intro: `Two real ships. No crew. No explanation. In 90 minutes you will read about the Mary Celeste and the Baychimo, listen to a documentary, practise past and present tenses, work through FCE Use of English tasks and write a ghost-ship story of your own.`,
  homeNote: `Exercises marked "Extra" can be done as homework. The writing box keeps your text in this browser and saves it as a Word file.`,
  stages: []
};

LESSON.stages.push({ id: 'plan', nav: 'Plan', title: 'Ghost Ships', min: 0, home: true, hue: 'navy' });

/* 1 LEAD-IN */
LESSON.stages.push({
  id: 'lead', nav: 'Lead-in', title: 'Lead-in: what is a ghost ship?', min: 5, hue: 'teal',
  desc: 'Photos, speculation and three quick predictions.',
  blocks: [
    { t: 'html', html: `<p class="lede">An empty ship. No crew. No message. Look at the pictures and think about what you see.</p>` },
    {
      t: 'photos', items: [
        { src: 'media/baychimo.jpg', alt: 'The steamship Baychimo surrounded by pack ice', cap: 'Photo A: a steamship stuck in pack ice.' },
        { src: 'media/mary-celeste.jpg', alt: 'A two-masted sailing ship at sea', cap: 'Photo B: a two-masted sailing ship in a storm.', slot: 'Photo B: the Mary Celeste' }
      ]
    },
    {
      t: 'qs', title: 'Talk about it', items: [
        `Look at photo A. What kind of ship is it? Where is it? Use <b>might</b>, <b>must</b> or <b>can't</b> to speculate.`,
        `What does the phrase <b>ghost ship</b> make you think of? Describe the picture in your head.`,
        `You find a ship at sea with nobody on board. What do you do first? What do you take, and what do you leave?`,
        `Do you enjoy unsolved mysteries? Why do they stay in our memory for so long?`
      ]
    },
    {
      t: 'ex', id: 'predict', kind: 'mcq', tag: 'Core', title: 'Guess first, check later',
      instr: 'You do not need to know the answers. Choose the one you think is most likely. You will find out in the next stages.',
      items: [
        { q: `In 1872 the <b>Mary Celeste</b> was found drifting in the Atlantic. What was missing?`, o: ['the cargo', 'the lifeboat', 'all the sails'], a: 1, why: `The lifeboat had gone. The cargo was almost untouched and some sails were still set.` },
        { q: `What was the Mary Celeste carrying?`, o: ['gold coins', 'industrial alcohol', 'furs'], a: 1, why: `She carried 1,701 barrels of industrial alcohol. The Baychimo was the ship with the furs.` },
        { q: `After her crew left her in 1931, the <b>Baychimo</b> was still seen floating in the Arctic for about…`, o: ['three months', 'four years', 'thirty-eight years'], a: 2, why: `The last report was in 1969, thirty-eight years later.` }
      ]
    }
  ]
});

/* 2 VOCABULARY */
LESSON.stages.push({
  id: 'vocab', nav: 'Vocabulary', title: 'Vocabulary: words for the sea and the unknown', min: 8, hue: 'violet',
  desc: 'Learn 14 key words with cards, then match them and use them in sentences.',
  blocks: [
    { t: 'html', html: `<p class="lede">First <b>learn</b> the words, then <b>practise</b> them. You will meet all of them again in the stories and in the listening.</p>` },
    {
      t: 'flip', title: 'Step 1. Word cards', instr: 'Look at the word and try to explain it. Then click the card to see the meaning and an example.',
      items: [
        { k: 'verb', w: 'abandon', d: 'leave a ship or a place for ever because staying is dangerous', eg: 'The villagers abandoned their homes before the flood.' },
        { k: 'noun', w: 'cargo', d: 'the goods that a ship carries', eg: 'The ship’s cargo was timber and coal.' },
        { k: 'verb', w: 'drift', d: 'be carried slowly by wind or water, with nobody controlling you', eg: 'Without an engine, the raft drifted out to sea.' },
        { k: 'adjective', w: 'eerie', d: 'strange and a little frightening, in a quiet way', eg: 'The empty harbour felt eerie at midnight.' },
        { k: 'noun', w: 'hull', d: 'the main body of a ship', eg: 'A rock tore a hole in the hull.' },
        { k: 'verb', w: 'salvage', d: 'save a ship or its cargo from being lost', eg: 'Divers salvaged gold coins from the wreck.' },
        { k: 'verb', w: 'vanish', d: 'disappear suddenly and completely', eg: 'When the mist cleared, the island had vanished.' },
        { k: 'noun', w: 'log', d: 'the official written record of a ship’s journey', eg: 'The officer wrote the wind speed in the log every hour.' },
        { k: 'noun', w: 'crew', d: 'all the people who work on a ship', eg: 'The whole crew came on deck to watch the storm.' },
        { k: 'adjective', w: 'seaworthy', d: 'in good enough condition to sail safely', eg: 'After the repairs the old yacht was seaworthy again.' },
        { k: 'noun', w: 'mutiny', d: 'when sailors refuse to obey the captain and take control of the ship', eg: 'The captain was afraid of a mutiny after six months at sea.' },
        { k: 'adjective', w: 'adrift', d: 'floating on the water with nobody controlling it', eg: 'The lifeboat was found adrift, with no oars.' },
        { k: 'adjective', w: 'trapped', d: 'unable to escape from a place', eg: 'The miners were trapped underground for two days.' },
        { k: 'phrase', w: 'bound for', d: 'travelling towards a place', eg: 'A ferry bound for Dover left at noon.' }
      ]
    },
    {
      t: 'ex', id: 'vmatch1', kind: 'match', tag: 'Step 2', title: 'Match the words to the meanings: set 1',
      instr: 'Read the meanings in the box. Choose the letter for each word.',
      defs: [
        'the main body of a ship',
        'be carried slowly by wind or water, with nobody controlling you',
        'disappear suddenly and completely',
        'strange and a little frightening, in a quiet way',
        'leave a ship or a place for ever because staying is dangerous',
        'the goods that a ship carries',
        'save a ship or its cargo from being lost'
      ],
      items: [{ q: 'abandon', a: 4 }, { q: 'cargo', a: 5 }, { q: 'drift', a: 1 }, { q: 'eerie', a: 3 }, { q: 'hull', a: 0 }, { q: 'salvage', a: 6 }, { q: 'vanish', a: 2 }]
    },
    {
      t: 'ex', id: 'vmatch2', kind: 'match', tag: 'Step 2', title: 'Match the words to the meanings: set 2',
      instr: 'Same task. Choose the letter for each word.',
      defs: [
        'unable to escape from a place',
        'the official written record of a ship’s journey',
        'travelling towards a place',
        'when sailors refuse to obey the captain and take control',
        'all the people who work on a ship',
        'floating on the water with nobody controlling it',
        'in good enough condition to sail safely'
      ],
      items: [{ q: 'log', a: 1 }, { q: 'crew', a: 4 }, { q: 'seaworthy', a: 6 }, { q: 'mutiny', a: 3 }, { q: 'adrift', a: 5 }, { q: 'trapped', a: 0 }, { q: 'bound for', a: 2 }]
    },
    {
      t: 'ex', id: 'vgap', kind: 'gap', tag: 'Step 3', title: 'Use the words in sentences',
      instr: 'Type the missing word from the box. Change the form if you need to. Each word is used once.',
      bank: ['adrift', 'abandon', 'drift', 'log', 'seaworthy', 'bound for', 'eerie', 'salvage'],
      items: [
        { q: `The ship was found ___ in the middle of the ocean, with nobody on board.`, a: ['adrift'], why: `<i>Adrift</i> describes a ship floating with nobody controlling it.` },
        { q: `The captain gave the order to ___ the ship before it sank.`, a: ['abandon'], why: `After <i>to</i> we use the base form: <i>abandon</i>.` },
        { q: `After the engine failed, the little boat began to ___ towards the rocks.`, a: ['drift'], why: `<i>Drift</i> is the verb. <i>Adrift</i> is an adjective and cannot follow <i>to</i> here.` },
        { q: `We know the ship's last position because the captain kept a careful ___.`, a: ['log', 'logbook', 'log book'], why: `A captain keeps a <i>log</i> or <i>logbook</i> with the position and the weather.` },
        { q: `Nobody wanted to sail the old boat because it was no longer ___.`, a: ['seaworthy'], why: `<i>Seaworthy</i> means safe enough to go to sea.` },
        { q: `The ship was ___ Genoa when she left New York.`, a: ['bound for'], why: `<i>Bound for</i> + place means travelling towards it.` },
        { q: `The only sound was the creak of old wood. It was an ___ silence.`, a: ['eerie'], why: `<i>Eerie</i> is strange and slightly frightening. Note <i>an</i> before a vowel sound.` },
        { q: `Anyone who finds an abandoned ship may receive money for ___ it.`, a: ['salvaging', 'salvage'], hint: 'After a preposition (for) we use the -ing form.', why: `After <i>for</i> we use the -ing form: <i>salvaging</i>.` }
      ]
    },
    { t: 'note', html: `<h3>Word families (useful for Part 3)</h3><p><b>vanish</b> → vanishing (adj). <b>disappear</b> → disappearance (n). <b>abandon</b> → abandoned (adj), abandonment (n). <b>salvage</b> → salvaged (adj). <b>drift</b> → drifting (adj), drifter (n).</p>` }
  ]
});

/* 3 MARY CELESTE */
LESSON.stages.push({
  id: 'mary', nav: 'Mary Celeste', title: 'Story A: the Mary Celeste', min: 8, hue: 'blue',
  desc: 'Read the 1872 mystery and decide: True, False or Not Given.',
  blocks: [
    {
      t: 'read', title: 'The Ship That Sailed On Alone', sub: 'Atlantic Ocean, 1872',
      paras: [
        `On <b>7 November 1872</b> the brigantine <i>Mary Celeste</i> left New York, <b>bound for</b> Genoa in Italy. In her hold were 1,701 barrels of industrial alcohol. On board were ten people: Captain Benjamin Briggs, his wife Sarah, their two-year-old daughter Sophia, and a crew of seven. Briggs was an experienced captain and, by all accounts, a careful and sober man. Nothing about the voyage looked unusual.`,
        `Almost a month later, on 4 December, the crew of the British ship <i>Dei Gratia</i> were sailing between the Azores and Portugal when they noticed another vessel in the distance. She was moving strangely, zigzagging across the waves with her sails badly set, as if nobody was steering her. Captain Morehouse signalled again and again, but there was no reply. In the end he sent a small boat across to find out what was wrong.`,
        `The men who climbed aboard found an empty deck. The ship was damp and untidy, but she was not sinking, and she was perfectly <b>seaworthy</b>. There was about a metre of water in the hold, and one of the two pumps had been taken apart. The lifeboat had gone. The captain's navigation instruments and the ship's papers had disappeared too. Yet there was food and water for six months, the sailors' belongings were still in their cabins, and the cargo was almost untouched: only nine barrels were empty. The last entry in the log was dated 25 November, ten days earlier, and it gave no hint of danger.`,
        `Later writers could not resist adding drama: a hot breakfast still steaming on the table, a cat asleep by the stove. None of it was true. The real facts were strange enough. A frayed rope was trailing behind the ship, as though the lifeboat had once been tied to her. The <i>Dei Gratia</i> men sailed the ship to Gibraltar, hoping for a <b>salvage</b> reward, but a suspicious official there accused them of murder and piracy. The court found no evidence of any crime. It never found out what had really happened, either.`,
        `Over the years people have suggested explanations: fumes from the alcohol, a violent storm, pirates, a mutiny, even a giant squid. None has ever been proved. The people on board were never seen again. The ship herself sailed on for another thirteen years and was finally wrecked off Haiti in 1885. By then her name was already a legend.`
      ],
      gloss: [
        ['brigantine', 'a sailing ship with two masts'], ['hold', 'the space inside a ship where cargo is kept'],
        ['pump', 'a machine that removes water'], ['sober', 'not drunk'],
        ['frayed', 'worn, with loose threads at the end'], ['trailing', 'hanging or being pulled behind'],
        ['salvage reward', 'payment for saving a ship'], ['piracy', 'robbery at sea']
      ]
    },
    {
      t: 'ex', id: 'tfA', kind: 'tfng', tag: 'Core', title: 'True, False or Not Given?',
      instr: 'True = the text says this. False = the text says the opposite. Not Given = the text does not say.',
      items: [
        { q: 'The Mary Celeste left New York in November 1872.', a: 'T', why: `The text gives the date: 7 November 1872.` },
        { q: 'Captain Briggs was travelling alone.', a: 'F', why: `He sailed with his wife, his daughter and a crew of seven.` },
        { q: 'Briggs had a reputation as a heavy drinker.', a: 'F', why: `The text calls him a careful and sober man.` },
        { q: 'Nobody replied when the Dei Gratia signalled.', a: 'T', why: `<i>Captain Morehouse signalled again and again, but there was no reply.</i>` },
        { q: 'The ship was sinking when the Dei Gratia men found her.', a: 'F', why: `<i>She was not sinking, and she was perfectly seaworthy.</i>` },
        { q: 'All the barrels of alcohol were full.', a: 'F', why: `<i>Only nine barrels were empty</i>, so almost all were full, but not all.` },
        { q: 'The Dei Gratia crew received a salvage payment.', a: 'NG', why: `The text says they were <i>hoping for</i> a reward. It does not say if they received one.` },
        { q: 'Captain Briggs had sailed to Genoa before.', a: 'NG', why: `The text never mentions any earlier voyage to Genoa.` },
        { q: 'The last entry in the log was written about ten days before the ship was found.', a: 'T', why: `The log ended on 25 November, ten days earlier.` }
      ]
    },
    {
      t: 'qs', title: 'Discuss', items: [
        `Which detail is the most mysterious for you: the missing lifeboat, the untouched cargo or the log that ends with no warning? Why?`,
        `Imagine you are Captain Briggs and you smell alcohol fumes in the hold. Would you leave the ship? What would you do?`,
        `Why do people add invented details, like the hot breakfast, to true stories?`
      ]
    }
  ]
});

/* 4 BAYCHIMO */
LESSON.stages.push({
  id: 'baychimo', nav: 'Baychimo', title: 'Story B: the Baychimo', min: 9, hue: 'cyan',
  desc: 'Read about the Ghost Ship of the Arctic, match headings and answer multiple-choice questions.',
  blocks: [
    {
      t: 'read', num: true, title: 'The Ship That Refused to Sink', sub: 'Alaska and the Arctic, 1931–1969',
      paras: [
        `The <i>Baychimo</i> was a steel cargo steamer, about seventy metres long. She was built in Sweden in 1914, but after the First World War she became British property, and in 1921 the Hudson's Bay Company bought her. Every summer she sailed from Vancouver to the far north of Canada and Alaska, carrying supplies to the Arctic coast and bringing back <b>furs</b>. Her crew thought of her as a tough, reliable old ship.`,
        `In autumn 1931 her luck ran out. Sailing home with a hold full of furs, she was caught by a sudden <b>blizzard</b> near Point Barrow, Alaska, and <b>pack ice</b> closed in around her. The crew managed to free her once, but she soon became <b>trapped</b> again. This time the company sent aircraft to lift most of the men to safety. About fifteen stayed behind in a <b>makeshift</b> shelter near the ship, waiting to see whether she would survive.`,
        `Then a fierce November storm hit the coast. When it ended, the ship had vanished. The men were sure the ice had crushed her and that she was at the bottom of the sea. A few days later, however, an Inuit hunter reported that a large ship was floating about forty-five miles away. The crew tracked her down, took out the most valuable furs, and agreed that she would never survive the winter. They left her for the last time and went home.`,
        `But the <i>Baychimo</i> did not sink. Over the next decades hunters, sailors and people travelling by dog sled saw her again and again, sometimes locked in the ice for months, sometimes drifting hundreds of miles from where she had last been seen. In 1933 a group of travellers climbed aboard and were trapped on her for ten days by a storm. Nobody ever managed to bring her home. Alaskans began to call her the Ghost Ship of the Arctic.`,
        `The last report came in 1969, thirty-eight years after her crew had left her, when a group of Inuit saw her stuck in the ice of the Beaufort Sea. In 2006 the Alaskan government began a project to look for her wreck, so far without success. Most experts believe that she finally sank long ago. Nobody can be sure.`
      ],
      gloss: [
        ['steamer', 'a ship driven by a steam engine'], ['furs', 'animal skins with the hair still on, used for clothes'],
        ['blizzard', 'a violent snowstorm with strong wind'], ['pack ice', 'a large area of floating ice pushed together'],
        ['makeshift', 'built quickly from whatever is available'], ['track down', 'find after a long search'],
        ['Inuit', 'the indigenous people of the Arctic regions']
      ]
    },
    {
      t: 'ex', id: 'headB', kind: 'match', tag: 'Task 1', title: 'Match a heading to each paragraph',
      instr: 'The paragraphs are numbered 1–5. Choose the best heading for each one. There are two extra headings that you do not need.',
      defs: [
        'The search goes on',
        'A new crew takes command',
        'Caught in the ice',
        'A tough working ship',
        'The captain’s secret plan',
        'Seen again and again',
        'Lost in a storm, found, then left behind'
      ],
      items: [
        { q: 'Paragraph 1', a: 3 }, { q: 'Paragraph 2', a: 2 }, { q: 'Paragraph 3', a: 6 }, { q: 'Paragraph 4', a: 5 }, { q: 'Paragraph 5', a: 0 }
      ]
    },
    {
      t: 'ex', id: 'mcqB', kind: 'mcq', tag: 'Task 2', title: 'Choose the best answer, A, B, C or D',
      instr: 'This is the same type of question as in FCE Reading Part 5. Only one answer is correct.',
      items: [
        { q: `Why did the company send aircraft in 1931?`, o: ['to bring the furs home', 'to lift most of the men to safety', 'to look for an Inuit hunter', 'to break the ice around the ship'], a: 1, why: `<i>The company sent aircraft to lift most of the men to safety.</i>` },
        { q: `What did the men think when the storm ended and the ship had vanished?`, o: ['She had been stolen.', 'She was floating nearby.', 'The ice had crushed her.', 'She had sailed home alone.'], a: 2, why: `<i>The men were sure the ice had crushed her and that she was at the bottom of the sea.</i>` },
        { q: `What does <b>her luck ran out</b> mean in paragraph 2?`, o: ['She had no more fuel.', 'Her period of good fortune came to an end.', 'The crew lost the ship’s papers.', 'The company refused to pay for repairs.'], a: 1, why: `<i>Her luck ran out</i> means that the good fortune ended and bad things began.` },
        { q: `Why could the travellers who climbed aboard in 1933 not leave for ten days?`, o: ['They were ill.', 'The crew had locked the doors.', 'A storm kept them on the ship.', 'They had no food.'], a: 2, why: `<i>They were trapped on her for ten days by a storm.</i>` },
        { q: `What is the writer’s attitude in the last paragraph?`, o: ['She is sure that the ship still floats.', 'She is certain that the experts are wrong.', 'She is bored by the story.', 'She is careful: the ship probably sank, but nobody knows.'], a: 3, why: `<i>Most experts believe that she finally sank… Nobody can be sure.</i> The writer is cautious.` }
      ]
    },
    {
      t: 'qs', title: 'Discuss', items: [
        `Why do you think the Baychimo stayed afloat for so long? Think about the hull, the cold and the ice.`,
        `Would you try to rescue a ghost ship if you found one? Why or why not?`,
        `Compare the two stories. In the Mary Celeste the <b>people</b> disappeared. In the Baychimo the <b>people</b> left, but the <b>ship</b> would not go away. Which mystery is stranger?`
      ]
    }
  ]
});

/* 5 THEORIES */
LESSON.stages.push({
  id: 'theories', nav: 'Theories', title: 'Theories and mysteries', min: 7, hue: 'coral',
  desc: 'Read the case files, learn how to speculate about the past and practise it.',
  blocks: [
    { t: 'html', html: `<p class="lede">What really happened? Here are the theories from the documentaries. Read each case file, then rate how convincing it is.</p>` },
    {
      t: 'cards', items: [
        { id: 'fumes', h: 'Alcohol fumes', tag: 'Mary Celeste', nar: `Cut to the hold. The barrels are old and the sea is rough. Slowly, alcohol leaks out and fumes rise through the ship. Captain Briggs hears a loud bang. Is the whole ship about to explode? He gives the order: everyone into the lifeboat. They wait at the end of a rope, ready to climb back. Then the rope snaps.`, pro: `Experiments have shown that alcohol fumes can cause a loud explosion without damaging the ship.`, con: `The lifeboat was never found. If it was only a scare, why did nobody reach land?` },
        { id: 'sea', h: 'Seaquake or waterspout', tag: 'Mary Celeste', nar: `The sea is calm. Then, without warning, the ocean floor shakes. Or a waterspout, a tornado over the water, tears across the deck and floods the hold. In seconds the captain decides: abandon ship.`, pro: `There was water in the hold, and the weather had been bad for two weeks.`, con: `Nothing on the ship was broken, and her sails were still set.` },
        { id: 'pirates', h: 'Pirates', tag: 'Mary Celeste', nar: `A dark flag on the horizon. Armed men climb aboard, push the crew into the lifeboat and sail away. It is a perfect crime, except for one thing.`, pro: `The ship was empty, and some papers and instruments had gone.`, con: `Pirates would have stolen the cargo and the valuables. Nothing valuable was taken.` },

LESSON.stages.push({
  id: 'grammar', nav: 'Grammar', title: 'Grammar: past tenses vs present tenses', min: 10, hue: 'amber',
  desc: 'Choose the right tense for the story, the documentary and the theories.',
  blocks: [
    {
      t: 'table', html: `<table class="tt"><thead><tr><th>Tense</th><th>Use it for</th><th>Example</th></tr></thead><tbody>
<tr><td>Past Simple</td><td>finished events: the main line of the story</td><td class="eg">The Dei Gratia found the ship on 4 December.</td></tr>
<tr><td>Past Continuous</td><td>background, or an action in progress when something happened</td><td class="eg">The sailors were sailing towards Portugal when they saw a ship.</td></tr>
<tr><td>Past Perfect</td><td>an action before another past action</td><td class="eg">The crew had left before the Dei Gratia arrived.</td></tr>
<tr><td>Past Perfect Continuous</td><td>a longer activity before a past moment, often the reason for what we see</td><td class="eg">The ship had been drifting for ten days.</td></tr>
<tr><td>Present Simple</td><td>facts, theories, and the historic present in documentaries</td><td class="eg">Some experts believe that fumes caused an explosion. / The captain steps on deck.</td></tr>
<tr><td>Present Continuous</td><td>a scene happening now, or a changing situation</td><td class="eg">A small boat is rowing towards the ship.</td></tr>
<tr><td>Present Perfect</td><td>the past connected to now: results, experience, <i>so far, yet, ever, never, since, for</i></td><td class="eg">Nobody has ever explained what happened.</td></tr>
<tr><td>Present Perfect Continuous</td><td>an activity that started in the past and continues, or has just stopped</td><td class="eg">Researchers have been looking for the Baychimo since 2006.</td></tr>
</tbody></table>`
    },
    { t: 'note', html: `<h3>Two contrasts to remember</h3><ul><li><b>Past Simple vs Present Perfect.</b> A finished time (<i>in 1872, last night, ago</i>) needs the Past Simple. An unfinished time or no time (<i>this year, so far, ever, since</i>) needs the Present Perfect. <span class="eg">The ship was found in 1872. The ship has been famous for over 150 years.</span></li><li><b>Narration.</b> To tell a story that happened, use past tenses. Documentaries and jokes often use the present (the <i>historic present</i>) to make the past feel close: <span class="eg">The captain steps aboard. He sees nobody.</span></li></ul>` },

<h4 style="margin:14px 0 6px">Model story (about 170 words)</h4><div class="model">
<p>I <mark>had never believed</mark> in ghost ships until the night we found the <i>Silver Gull</i> drifting in the fog. We were returning from a fishing trip and the engine <mark>was running</mark> badly, so Dad was already in a bad mood. Then, through the mist, I <mark>made out</mark> a tall shape with no lights.</p>
<p>“Nobody is on deck,” my brother whispered. We came alongside and Dad climbed aboard with a torch. The cabin door was open, and on the table a cup of tea was still warm. The lifeboat <mark>had gone</mark>, and the radio was crackling on the emergency channel.</p>
<p>We searched every corner, but there was no one. “They <mark>must have left</mark> in a hurry,” Dad said, but his voice was shaking. <mark>While</mark> he <mark>was checking</mark> the logbook, I noticed that the last entry <mark>had been written</mark> only an hour earlier.</p>
<p><mark>By the time</mark> we got back to our boat, the fog <mark>had swallowed</mark> the <i>Silver Gull</i>. We reported it to the coastguard, who found nothing. To this day I wonder who <mark>had been writing</mark> in that log.</p></div>
<p class="eg">Highlighted: past tenses, speculation, a phrasal verb and a time linker.</p>`

  while (i < n && j < m) {

    else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;

  return { a: ma, b: mb };
}

    var paras = b.text.split(/\n+/), flat = [], idx = [];
    paras.forEach(function (p, pi) { p.split(/\s+/).filter(Boolean).forEach(function (w) { var t = tokens(w); if (t.length) { flat.push(t.join('')); idx.push([pi, w]); } else idx.push([pi, w, true]); }); });
    var ot = [], map = [];
    idx.forEach(function (x, k) { if (!x[2]) { ot.push(tokens(x[1]).join('')); map.push(k); } });
    var st = tokens(ta.value), m = lcsMatch(ot, st), hit = 0;
    var flags = {}; ot.forEach(function (w, k) { if (m.a[k]) { hit++; flags[map[k]] = 1; } });
    var pct = Math.round(100 * hit / ot.length), out = '';
    var cur = -1;
    idx.forEach(function (x, k) {
      if (x[0] !== cur) { if (cur !== -1) out += '</p>'; out += '<p>'; cur = x[0]; }
      out += (x[2] || flags[k]) ? '<span class="hit">' + esc(x[1]) + '</span> ' : '<span class="miss">' + esc(x[1]) + '</span> ';
    });
    out += '</p>';
    var extra = st.filter(function (w, k) { return !m.b[k]; });
    res.innerHTML = '<p><b>Words correct: ' + hit + ' of ' + ot.length + ' (' + pct + '%).</b> Green = you wrote it. Red and wavy = missing or spelt differently in your text.</p>' + out +
      (extra.length ? '<p><b>Words in your text that are not in the original:</b> ' + esc(extra.join(', ')) + '</p>' : '') +
      '<p>This check ignores capital letters and punctuation. Compare those with the text yourself.</p>';
  }
  return wrap;
}

/* writing */
function makeWrite(b) {
  var wrap = el('div', 'stack');
  var sel = sget('prompt'); if (sel === null || !b.prompts[+sel]) sel = '0';
  var p1 = el('div', 'box'); p1.appendChild(el('h3', null, '1. Choose your task'));
  var radios = el('div', 'radios'); radios.setAttribute('role', 'radiogroup');
  b.prompts.forEach(function (p, i) {
    var lab = el('label', i === +sel ? 'on' : '', '<input type="radio" name="gsprompt" value="' + i + '"' + (i === +sel ? ' checked' : '') + '><span>' + p + '</span>');
    lab.querySelector('input').onchange = function () {
      sset('prompt', String(i)); Array.prototype.forEach.call(radios.children, function (c) { c.className = ''; }); lab.className = 'on';
    };
    radios.appendChild(lab);
  });
  p1.appendChild(el('div', null, '')); p1.appendChild(radios); wrap.appendChild(p1);

  var p2 = el('div', 'box'); p2.appendChild(el('h3', null, '2. Plan your story'));
  p2.appendChild(el('p', 'instr', 'Make notes, not sentences. Four short paragraphs are enough.'));
  b.plan.forEach(function (f, i) {
    var d = el('div', 'field'); var id = 'plan' + i;
    d.innerHTML = '<label for="' + id + '">' + f[0] + '</label>'; var t = el('textarea', 'in'); t.id = id; t.placeholder = f[1]; t.value = sget(id) || '';
    t.addEventListener('input', function () { sset(id, t.value); }); d.appendChild(t); p2.appendChild(d);
  });
  wrap.appendChild(p2);

  var p3 = el('div', 'box'); p3.appendChild(el('h3', null, '3. Write your story'));
  p3.appendChild(el('p', 'instr', 'Write 140 to 190 words. Your text is kept in this browser while you work.'));
  var ttl = el('input', 'in'); ttl.type = 'text'; ttl.id = 'storytitle'; ttl.placeholder = 'Title (optional)'; ttl.style.width = '100%'; ttl.setAttribute('aria-label', 'Story title'); ttl.value = sget('title') || '';
  ttl.addEventListener('input', function () { sset('title', ttl.value); });
  var ta = el('textarea', 'in big'); ta.id = 'storytext'; ta.setAttribute('aria-label', 'Your story'); ta.value = sget('story') || '';
  var wc = el('p', 'wc', ''), status = el('p', 'status', '');
  function upd() {
    var n = wordCount(ta.value); wc.textContent = n + ' words (target 140–190)';
    wc.className = 'wc ' + (n >= 140 && n <= 190 ? 'good' : n ? 'warn' : ''); sset('story', ta.value);
  }
  ta.addEventListener('input', upd); upd();
  p3.appendChild(ttl); p3.appendChild(el('div', null, '')); p3.appendChild(ta); p3.appendChild(wc);
  var bar = el('div', 'bar');
  bar.appendChild(btn('Save as Word (.docx)', 'primary', function () {
    if (!ta.value.trim()) { status.textContent = 'Write something first.'; return; }
    var paras = [{ text: ttl.value.trim() || 'My ghost-ship story', bold: true, size: 32 }];
    var plan = b.plan.map(function (f, i) { return (sget('plan' + i) || '').trim() ? f[0] + ': ' + sget('plan' + i).trim() : ''; }).filter(Boolean);
    var chosen = b.prompts[+(sget('prompt') || 0)].replace(/<[^>]+>/g, '');
    paras.push({ text: 'Task: ' + chosen, italic: true, size: 22 });
    paras = paras.concat(textToParas(ta.value));
    paras.push({ text: wordCount(ta.value) + ' words', italic: true, size: 20 });
    if (plan.length) { paras.push({ text: 'My plan', bold: true, size: 26 }); plan.forEach(function (x) { paras.push({ text: x, size: 22, after: 80 }); }); }
    saveBlob('Ghost-ship-story.docx', makeDocx(paras), status);
  }));
  bar.appendChild(btn('Copy text', 'ghost', function () { copyText((ttl.value ? ttl.value + '\n\n' : '') + ta.value, status); }));
  bar.appendChild(btn('Clear my story', 'ghost', function () { ta.value = ''; ttl.value = ''; sset('title', ''); upd(); }));
  p3.appendChild(bar); p3.appendChild(status); wrap.appendChild(p3);

  var p4 = el('div', 'box'); p4.appendChild(el('h3', null, '4. Check before you finish'));
  var ul = el('ul', 'checks');
  b.checks.forEach(function (c, i) {
    var id = 'chk' + i, li = el('li'); var lab = el('label'); var cb = el('input'); cb.type = 'checkbox'; cb.id = id; cb.checked = sget(id) === '1';
    cb.onchange = function () { sset(id, cb.checked ? '1' : '0'); };
    lab.appendChild(cb); lab.appendChild(el('span', null, c)); li.appendChild(lab); ul.appendChild(li);
  });
  p4.appendChild(ul); wrap.appendChild(p4);
  wrap.appendChild(makeDetails({ sum: 'See a model plan and a model story', html: b.model }));
  return wrap;
}

function makeBlock(b) {
  switch (b.t) {
    case 'html': return el('div', 'prose', b.html);
    case 'note': return el('div', 'note' + (b.cls ? ' ' + b.cls : ''), b.html);
    case 'photo': return makePhoto(b);
    case 'photos': { var g = el('div', 'photos'); b.items.forEach(function (p) { g.appendChild(makePhoto(p)); }); return g; }
    case 'qs': return makeQs(b);
    case 'read': return makeRead(b);
    case 'ex': return makeEx(b);
    case 'details': return makeDetails(b);
    case 'audio': return makeAudio(b);
    case 'cards': return makeCards(b);
    case 'flip': return makeFlip(b);
    case 'dictation': return makeDictation(b);
    case 'write': return makeWrite(b);
    case 'table': { var w = el('div', 'tw'); w.innerHTML = b.html; return w; }
  }
  return el('div');
}

/* ---------- stages ---------- */
var tabs = document.getElementById('tabs'), stageEl = document.getElementById('stage'), cur = 0, chips = [];

function makeHome() {
  var d = el('div', 'stack home');
  d.appendChild(el('p', 'lede', L.intro));
  var rows = L.stages.slice(1).map(function (s, i) {
    return '<tr><td class="m">' + s.min + ' min</td><td><button type="button" data-go="' + (i + 1) + '">' + s.title + '</button></td><td>' + s.desc + '</td></tr>';
  }).join('');
  var total = L.stages.reduce(function (a, s) { return a + (s.min || 0); }, 0);
  var t = el('div', 'tw', '<table class="tt" style="min-width:520px"><thead><tr><th>Time</th><th>Stage</th><th>What you do</th></tr></thead><tbody>' + rows + '</tbody></table>');
  Array.prototype.forEach.call(t.querySelectorAll('[data-go]'), function (b) { b.onclick = function () { show(+b.getAttribute('data-go')); }; });
  d.appendChild(t);
  d.appendChild(el('p', null, '<b>Total: ' + total + ' minutes.</b> ' + L.homeNote));
  d.appendChild(btn('Start the lesson', 'next', function () { show(1); }));
  return d;
}

function show(i) {
  cur = i; var s = L.stages[i];
  chips.forEach(function (c, k) { c.setAttribute('aria-current', k === i ? 'true' : 'false'); });
  stageEl.innerHTML = '';
  var wrap = el('div', 'stagewrap'); wrap.setAttribute('data-hue', s.hue || 'navy');
  if (TEACHER) wrap.appendChild(el('div', 'tbanner', 'Teacher mode: use "Show answers" on any exercise'));
  var head = el('div', 'stagehead'); head.appendChild(el('h2', null, s.title)); if (s.min) head.appendChild(el('span', 'mins', s.min + ' min'));
  wrap.appendChild(head);
  var st = el('div', 'stack');
  if (s.home) st.appendChild(makeHome()); else s.blocks.forEach(function (b) { st.appendChild(makeBlock(b)); });
  wrap.appendChild(st);
  var foot = el('div', 'foot');
  if (i > 0) foot.appendChild(btn('← ' + L.stages[i - 1].nav, 'ghost', function () { show(i - 1); }));
  else foot.appendChild(el('span'));
  if (i < L.stages.length - 1 && !s.home) foot.appendChild(btn('Next: ' + L.stages[i + 1].nav + ' →', 'next', function () { show(i + 1); }));
  wrap.appendChild(foot);
  stageEl.appendChild(wrap);
  sset('stage', String(i));
  window.scrollTo(0, 0);
  var c = chips[i]; if (c && c.scrollIntoView) { try { c.scrollIntoView({ inline: 'center', block: 'nearest' }); } catch (e) {} }
}

L.stages.forEach(function (s, i) {
  var c = el('button', 'chip', (i ? '<b>' + i + '</b>' : '') + s.nav); c.type = 'button'; c.setAttribute('aria-current', 'false'); c.setAttribute('data-hue', s.hue || 'navy');
  c.onclick = function () { show(i); }; tabs.appendChild(c); chips.push(c);
});
var start = parseInt(sget('stage') || '0', 10); if (!(start >= 0 && start < L.stages.length)) start = 0;
show(start);
})();

</script>
